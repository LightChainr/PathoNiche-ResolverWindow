    <text style="font-size: 8.4px; font-family: 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', 'Computer Modern Typewriter', 'Andale Mono', 'Nimbus Mono L', 'Courier New', 'Courier', 'Fixed', 'Terminal', monospace; fill: #262626" transform="translate(248.05152 59.491312)">E(e-&gt;l) = E(e) + 0.5 E(l)</text>
