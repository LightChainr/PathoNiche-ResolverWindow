  "seaborn==0.13.2",
  "h5py==3.16.0",
  "pyarrow==25.0.0",
  "diptest>=0.9,<1",
  "PyYAML==6.0.3",
  "anndata==0.12.19",
  "scanpy==1.11.5",
  "tifffile==2026.3.3",
  "scikit-image==0.26.0",
  "openpyxl==3.1.5",
  "harmonypy==2.0.0",
